# Stage 2 - one-input sparse state-feedback regulation policy.
seed: 0
policy_seed: 6
action_scale: 1.0
action_gradient_mode: leaky_straight_through
action_gradient_band: 0.05
action_gradient_leak: 0.01
nsteps: 50
n_samples: 2000
batch_size: 200
eval_seed: 0
eval_margin: 0.1
xmin_data: -4.0
xmax_data: 4.0
lr: 0.005
grad_clip: 5.0
proximal_l1: true
epochs: 3999
threshold: 0.25
prune_every: 400
prune_every_min: 300
prune_every_decay: 200
change_prune_every: true
threshold_mult: 1.17
threshold_max: 0.5
prune_noise: 0.02
lr_decay_enabled: true
lr_decay_gamma: 0.95
lr_decay_step: 50
l1_decay: 0.9
warmup: 200
patience: 50
verbosity: 500
logger_metrics:
  - train_loss
  - dev_loss
  - train_tracking_loss
  - dev_tracking_loss
  - train_l1_loss
  - dev_l1_loss
  - train_constraint_loss
  - dev_constraint_loss
  - learning_rate
weights: {Q_r: 20.0, Q_u: 1.0, Q_dx: 0.0, Q_du: 1.0, Q_con: 20.0, l1_coef: 0.008}
