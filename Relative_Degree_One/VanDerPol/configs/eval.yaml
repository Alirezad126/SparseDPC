# Stage 5 - fixed-controller comparison across seeds (Van der Pol).
# SD-DPC policy.yaml is the source of the horizon and every DPC loss coefficient.
inherit: policy.yaml
seed: 0
n_seeds: 20
eval_nsteps: 300
evaluation_plant: nominal
x0_min: -2.0
x0_max: 2.0
ref_target: [0.0, 0.0]
safe_xmin: -2.5
safe_xmax: 2.5
# These aliases are used only by SafetySpec; Q_con remains inherited from policy.yaml.
weights: {Q_con_x: 20.0, Q_con_du: 1.0}
bands: {box: 0.1, du: 0.01}
du_max: 0.5
methods: [mpc, sd_dpc, nn_dpc]
nn_policy: {layers: [32, 32], activation: gelu}
inference_benchmark: {warmup: 10, repeats: 200, iters: 1000, batch_size: 1, seed: 0}

# Each solve uses the complete inherited policy.nsteps (=50) trajectory and the shared
# VanDerPol SD-DPC loss. The optimized controls are executed as an open-loop block.
mpc:
  mode: dpc_open_loop
  integration_method: rk4
  match_dpc_constraints: true
  terminal_tol: 1.0e-2
  enforce_state_bounds: false
  enforce_safety_constraints: false
  warm_start: true
  max_iter: 1000
  tol: 1.0e-6
  acceptable_tol: 1.0e-4
  acceptable_iter: 15
  print_level: 0
