# Stage 5 - evaluation across seeds (Two-Tank).
seed: 0
n_seeds: 20
nsteps: 300
action_scale: 1.0
x0_min: 0.1
x0_max: 0.9
ref_target: [0.6, 0.6]
perturbation: {c1: 0.10, c2: 0.05}
weights: {Q_con_x: 20.0, Q_con_du: 1.0, Q_r: 1.0, Q_u: 0.01}
bands: {box: 0.05, du: 0.01}
du_max: 0.3
methods: [nominal, mismatch, unconstrained_autograd, unconstrained_symbolic, safe_barrier]
# Times only policy(x, r), using representative one-step inputs from each trajectory.
inference_benchmark: {warmup: 10, repeats: 200, iters: 1000, batch_size: 1, seed: 0}
unconstrained: {gamma_ref: 0.1, action_gradient_mode: straight_through, action_gradient_band: 0.1, action_gradient_leak: 0.05}
safe: {horizon: 20, gamma_ref: 0.1, gamma_safe: 0.05, max_safety_iters: 30, barrier_kind: squared_hinge, action_gradient_mode: straight_through, action_gradient_band: 0.1, action_gradient_leak: 0.05}
