# Stage 2 - sparse tracking policy (Two-Tank).
seed: 0
policy_seed: 0
action_scale: 1.0
action_gradient_mode: leaky_straight_through
action_gradient_band: 0.05  # full surrogate gradient this far outside either action bound
action_gradient_leak: 0.01 # surrogate gradient farther outside the band
nsteps: 50
n_samples: 2000
batch_size: 200
seed_data: 5
eval_seed: 0
eval_margin: 0.1  # sample quick-rollout initial states/references inside this bound fraction
lr: 0.005
grad_clip: 5.0
proximal_l1: false  # use weights.l1_coef in a soft-threshold update after each batch
epochs: 2000
threshold: 0.2
prune_every: 200
prune_every_min: 200
prune_every_decay: 50
change_prune_every: false
threshold_mult: 1.1
threshold_max: 0.3
prune_noise: 0.00
lr_decay_enabled: true
lr_decay_gamma: 0.97
lr_decay_step: 100
l1_decay: 1.0
warmup: 100
patience: 50
verbosity: 1
logger_metrics:
  - train_loss
  - dev_loss
  - train_tracking_loss
  - dev_tracking_loss
  - train_l1_loss
  - dev_l1_loss
  - train_constraint_loss
  - dev_constraint_loss
  - learning_rate

weights: {Q_r: 20.0, Q_u: 0.0, Q_dx: 0.0, Q_du: 0.0, Q_con: 20.0, l1_coef: 0.1}
